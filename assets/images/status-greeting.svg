      <stop offset="0" stop-color="#101c2d" stop-opacity="0.05" />
      <stop offset="0.58" stop-color="#101c2d" stop-opacity="0.12" />
      <stop offset="1" stop-color="#101c2d" stop-opacity="0.78" />
