minimal_mistakes_skin: "air"

locale: "en-US"
direction: "ltr"
title: "Nikosh Chaulagain"
title_separator: "-"
name: "Nikosh Chaulagain"
description: "Writing and creative work by Nikosh Chaulagain."
url: "https://3dartistmax.github.io"
baseurl: "/nikosh-com"
breadcrumbs: false
search: false

author:
  name: "Nikosh Chaulagain"
  bio: "Writing and creative work."
  email: "contact@nikosh.com.np"

footer:
  links:
    - label: "Impressum / Legal notice"
      icon: "fas fa-fw fa-scale-balanced"
      url: /impressum/
    - label: "Datenschutz / Privacy policy"
      icon: "fas fa-fw fa-shield-halved"
      url: /datenschutz/

include:
  - _pages
exclude:
  - docs
  - test
  - vendor
  - .bundle
  - node_modules
  - Gemfile
  - README.md
keep_files:
  - .git

encoding: "utf-8"
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

collections:
  status:
    output: true
  artworks:
    output: true

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: "_artworks"
      type: artworks
    values:
      layout: artwork
      author_profile: false
  - scope:
      path: "_status"
      type: status
    values:
      layout: single
      author_profile: false

after_footer_scripts:
  - /assets/js/site-enhancements.js
